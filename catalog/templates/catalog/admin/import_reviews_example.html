{% load i18n %}

<section id="listings">
	<style>
		sup {
			color: red;
			font-size: larger;
		}
	</style>
	<h2>{% trans "All required fields" %}</h2>
	<table class="listing">
		<thead>
		<tr>
			<th>Key</th>
			<th>Description</th>
		</tr>
		</thead>
		<tbody>
		<tr>
			<td>
				<sup>*</sup> id
			</td>
			<td>Page ID</td>
		</tr>
		<tr>
			<td>
				<sup>*</sup> text
			</td>
			<td>Review text.</td>
		</tr>
		<tr>
			<td>
				<sup>*</sup> user
			</td>
			<td>John Doe / john_doe_username</td>
		</tr>
		<tr>
			<td>
				<sup>*</sup> date
			</td>
			<td>
				Date of publication in format: <code>YYYY-MM-DD HH:MM</code>
			</td>
		</tr>
		<tr>
			<td>
				<sup>*</sup> rate
			</td>
			<td>Rating</td>
		</tr>
		</tbody>
	</table>
</section>
